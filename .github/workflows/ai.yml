name: AI

on:
  pull_request:
    types: [opened, ready_for_review]
  push:
    branches-ignore: [main]
    paths: ['specs/**', '.aiflow/02-design.md']
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [nightly]
        default: nightly

jobs:
  review:
    if: github.event_name == 'pull_request'
    uses: umars28/aiflow/.github/workflows/review.yml@main
    secrets: inherit

  build:
    if: github.event_name == 'push'
    uses: umars28/aiflow/.github/workflows/build.yml@main
    secrets: inherit

  nightly:
    if: github.event_name == 'workflow_dispatch'
    uses: umars28/aiflow/.github/workflows/nightly.yml@main
    secrets: inherit
