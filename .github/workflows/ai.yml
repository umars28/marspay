name: AI

on:
  pull_request:
    types: [opened, ready_for_review]
  push:
    branches-ignore: [main]
    paths: ['specs/**', '.aiflow/02-design.md']
  workflow_dispatch:
  repository_dispatch:
    types: [ai-fix]
  issues:
    types: [labeled]

jobs:
  review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: umars28/aiflow/.github/workflows/review.yml@main
    secrets: inherit

  build:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: umars28/aiflow/.github/workflows/build.yml@main
    secrets: inherit

  nightly:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: umars28/aiflow/.github/workflows/nightly.yml@main
    secrets: inherit

  fix:
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'ai-review')
    permissions:
      contents: write
      issues: read
      pull-requests: write
      id-token: write
    uses: umars28/aiflow/.github/workflows/fix.yml@main
    with:
      issue: ${{ github.event.client_payload.issue || github.event.issue.number }}
    secrets: inherit
